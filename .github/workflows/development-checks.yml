name: Development checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      COACH_DATABASE_URL: "sqlite:///:memory:"
      COACH_PROVIDER: local
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install the Linux PDF font and inspection tools
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-microhei fontconfig poppler-utils
      - name: Install the locked development environment
        run: |
          python -m pip install uv==0.11.32
          uv sync --locked --python 3.12
      - name: Check isolated offline baseline
        run: uv run --locked --no-sync python scripts/check_dev.py
